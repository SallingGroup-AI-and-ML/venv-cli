# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Linting and tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"


    - name: Install dependencies
      run: |
        python3.10 -m venv .venv --upgrade-deps
        . .venv/bin/activate
        python -m pip install --require-virtualenv -r dev-requirements.txt

    - name: Check linting/formatting
      run: |
        . .venv/bin/activate
        python -m isort --check .
        python -m black --config pyproject.toml --check .
        python -m mypy --config-file pyproject.toml

  test-bash:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python${{ matrix.python-version }} -m venv .venv --upgrade-deps
        . .venv/bin/activate
        python -m pip install --require-virtualenv -r dev-requirements.txt

    - name: Test with pytest (bash)
      run: |
        export SHELL="/usr/bin/bash"
        . .venv/bin/activate
        python -m pytest -n auto .
      shell: /usr/bin/bash -e {0}

  test-zsh:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install zsh
      run: sudo apt-get update; sudo apt-get install -y zsh

    - name: Install dependencies
      run: |
        python${{ matrix.python-version }} -m venv .venv --upgrade-deps
        . .venv/bin/activate
        python -m pip install --require-virtualenv -r dev-requirements.txt

    - name: Test with pytest (zsh)
      run: |
        export SHELL="/usr/bin/zsh"
        . .venv/bin/activate
        python -m pytest -n auto .
      shell: /usr/bin/zsh -e {0}
